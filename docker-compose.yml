# =====================================================
# Overleaf Docker Compose
# =====================================================
# Single-container deployment with embedded databases
# and on-demand LaTeX package installation
# =====================================================
# Usage:
#   docker compose up -d
#   Open http://localhost/launchpad to create admin account
# =====================================================

services:
  overleaf:
    image: blacksamuron05/overleaf-simplified:latest
    container_name: overleaf
    restart: always
    ports:
      - "80:80"
    volumes:
      # Persistent data storage
      - overleaf_data:/var/lib/overleaf
      - mongodb_data:/var/lib/mongodb
      - redis_data:/var/lib/redis
      - texlive_extra:/usr/local/texlive
    environment:
      # Application settings
      OVERLEAF_APP_NAME: "Overleaf Community Edition"
      OVERLEAF_SITE_URL: "http://localhost"

      # Admin settings
      # OVERLEAF_ADMIN_EMAIL: "admin@example.com"

      # Email settings (optional - configure if needed)
      # OVERLEAF_EMAIL_FROM_ADDRESS: "noreply@example.com"
      # OVERLEAF_EMAIL_SMTP_HOST: "smtp.example.com"
      # OVERLEAF_EMAIL_SMTP_PORT: "587"
      # OVERLEAF_EMAIL_SMTP_SECURE: "false"
      # OVERLEAF_EMAIL_SMTP_USER: ""
      # OVERLEAF_EMAIL_SMTP_PASS: ""

      # IMPORTANT: Required for invite token generation
      # OVERLEAF_INVITE_TOKEN_SECRET: generate with `openssl rand -base64 32`

      # Embedded databases (run MongoDB + Redis inside this container)
      EMBEDDED_MONGO: "true"
      EMBEDDED_REDIS: "true"

      # Database connections (localhost — same container, replica set for transactions)
      OVERLEAF_MONGO_URL: "mongodb://127.0.0.1:27017/sharelatex?replicaSet=overleaf"
      OVERLEAF_REDIS_HOST: "127.0.0.1"
      REDIS_HOST: "127.0.0.1"

      # Compilation settings
      SANDBOXED_COMPILES: "false"
      DOCKER_RUNNER: "false"

      # Auto-install missing LaTeX packages during compilation
      AUTO_INSTALL_PACKAGES: "true"

      # Feature flags
      EMAIL_CONFIRMATION_DISABLED: "true"
      ENABLE_CONVERSIONS: "true"
      OPTIMISE_PDF: "true"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  overleaf_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  texlive_extra:
    driver: local
