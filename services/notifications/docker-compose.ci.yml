services:
  test_unit:
    image: ci/$PROJECT_NAME:$BRANCH_NAME_TAG_SAFE-$BUILD_NUMBER
    user: node
    volumes:
      - ./reports:/overleaf/services/notifications/reports
      - ../../bin/shared/wait_for_it:/overleaf/bin/shared/wait_for_it
      - ../../tsconfig.backend.json:/overleaf/tsconfig.backend.json
    entrypoint: /overleaf/bin/shared/wait_for_it mongo:27017 --timeout=60 --
    command: yarn run test:unit:_run
    environment:
      CI:
      MONGO_CONNECTION_STRING: mongodb://mongo/test-overleaf
      NODE_ENV: test
      NODE_OPTIONS: "--unhandled-rejections=strict"
      VITEST_NO_CACHE: true
      REQ_VALIDATION_MODE: enforce
    depends_on:
      mongo:
        condition: service_started

  test_acceptance:
    image: ci/$PROJECT_NAME:$BRANCH_NAME_TAG_SAFE-$BUILD_NUMBER
    environment:
      CI:
      RETRIES:
      MONGO_HOST: mongo
      POSTGRES_HOST: postgres
      TEST_NAME_PATTERN: ${TEST_NAME_PATTERN}
      NODE_ENV: test
      NODE_OPTIONS: "--unhandled-rejections=strict"
      REQ_LOCKDOWN_MODE: throw
      REQ_VALIDATION_MODE: enforce
    volumes:
      - ./reports:/overleaf/services/notifications/reports
      - ../../bin/shared/wait_for_it:/overleaf/bin/shared/wait_for_it
      - ../../tsconfig.backend.json:/overleaf/tsconfig.backend.json
    depends_on:
      mongo:
        condition: service_started
    user: node
    entrypoint: /overleaf/bin/shared/wait_for_it mongo:27017 --timeout=60 --
    command: yarn run test:acceptance

  tar:
    build: .
    image: ci/$PROJECT_NAME:$BRANCH_NAME_TAG_SAFE-$BUILD_NUMBER
    volumes:
      - ./:/tmp/build/
    command: tar -czf /tmp/build/build.tar.gz --exclude=build.tar.gz --exclude-vcs .
    user: root

  mongo:
    image: mongo:8.0.11
    command: --replSet overleaf --notablescan
    volumes:
      - ../../bin/shared/mongodb-init-replica-set.js:/docker-entrypoint-initdb.d/mongodb-init-replica-set.js
      - ../../bin/shared/mongodb-docker-entrypoint-wait.sh:/mongodb-docker-entrypoint-wait.sh
    # Throw-away test data in tmpfs: the image declares a VOLUME here, which would otherwise leave an anonymous volume behind after every run.
    tmpfs:
      - /data/db
      - /data/configdb
    entrypoint: /mongodb-docker-entrypoint-wait.sh
    environment:
      MONGO_INITDB_DATABASE: sharelatex
    extra_hosts:
      # Required when using the automatic database setup for initializing the
      # replica set. This override is not needed when running the setup after
      # starting up mongo.
      - mongo:127.0.0.1
