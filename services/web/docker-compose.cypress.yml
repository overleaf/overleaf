services:
  cypress:
    build:
      context: ../../dockerfiles/cypress
      args:
        - USER_UID
        - USER_GID
    # Keep Chrome's shared memory in RAM, so cypress.config.ts can drop --disable-dev-shm-usage and its write-then-delete churn.
    shm_size: 1gb
    volumes:
      - ../../:/overleaf
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY:-/dev/null}:/home/node/.Xauthority
    working_dir: /overleaf/services/web
    entrypoint: yarn
    command: run cypress:open-ct
    environment:
      VERBOSE_LOGGING:
      DISPLAY: ${DISPLAY:-:0}
      # Must clear ws's 30s closing-handshake timeout during teardown, or a green run exits 1 (#36734).
      CYPRESS_INTERNAL_TEARDOWN_TIMEOUT: ${CYPRESS_INTERNAL_TEARDOWN_TIMEOUT:-45000}
      # Cypress's CLI filters teardown errors out of stderr; either of these shows them (#36734).
      DEBUG:
      ELECTRON_ENABLE_LOGGING:
