  test_acceptance:
    build:
      context: ../..
      dockerfile: services/real-time/Dockerfile
      target: base
    volumes:
      - .:/overleaf/services/real-time
      - ../../libraries:/overleaf/libraries
      - ../../package.json:/overleaf/package.json
      - ../../.yarnrc.yml:/overleaf/.yarnrc.yml
      - ../../yarn.lock:/overleaf/yarn.lock
      - ../../.yarn:/overleaf/.yarn
      - ../../.pnp.cjs:/overleaf/.pnp.cjs
      - ../../.pnp.loader.mjs:/overleaf/.pnp.loader.mjs
      - ../../.pnp.register.mjs:/overleaf/.pnp.register.mjs
    working_dir: /overleaf/services/real-time
    environment:
      RETRIES:
      REDIS_HOST: redis_test
      HISTORY_REDIS_HOST: redis_test
      QUEUES_REDIS_HOST: redis_test
      ANALYTICS_QUEUES_REDIS_HOST: redis_test
      ANALYTICS_QUEUES_BQ_SINK_REDIS_HOST: redis_test
      MONGO_CONNECTION_STRING: mongodb://mongo/test-overleaf
      POSTGRES_HOST: postgres
      TEST_NAME_PATTERN: ${TEST_NAME_PATTERN}
      LOG_LEVEL: ${LOG_LEVEL:-}
      NODE_ENV: test
      NODE_OPTIONS: "--require /overleaf/.pnp.cjs --import /overleaf/.pnp.register.mjs --unhandled-rejections=strict"
      REQ_LOCKDOWN_MODE: throw
      REQ_VALIDATION_MODE: enforce
    user: node
    depends_on:
      redis_test:
        condition: service_healthy
    command: yarn run --silent test:acceptance

  redis_test:
    image: redis:7.4.8
    # Throw-away test data in tmpfs: the image declares a VOLUME here, which would otherwise leave an anonymous volume behind after every run.
    tmpfs:
      - /data
    healthcheck:
      test: ping=$$(redis-cli ping) && [ "$$ping" = 'PONG' ]
      interval: 1s
      retries: 20
