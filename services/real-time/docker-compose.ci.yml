# This file was auto-generated, do not edit it directly.
# Instead run bin/update_build_scripts from
# https://github.com/overleaf/internal/

services:
  test_unit:
    image: ci/$PROJECT_NAME:$BRANCH_NAME_TAG_SAFE-$BUILD_NUMBER
    user: node
    volumes:
      - ./reports:/overleaf/services/real-time/reports
      - ../../tsconfig.backend.json:/overleaf/tsconfig.backend.json
    command: yarn run test:unit:_run
    environment:
      CI:
      MONGO_CONNECTION_STRING: mongodb://mongo/test-overleaf
      NODE_ENV: test
      NODE_OPTIONS: "--unhandled-rejections=strict"
      VITEST_NO_CACHE: true
      REDIS_HOST: redis_test
      QUEUES_REDIS_HOST: redis_test
      HISTORY_REDIS_HOST: redis_test
      ANALYTICS_QUEUES_REDIS_HOST: redis_test
      ANALYTICS_QUEUES_BQ_SINK_REDIS_HOST: redis_test
      REQ_VALIDATION_MODE: enforce
    depends_on:
      redis_test:
        condition: service_healthy

  test_acceptance:
    image: ci/$PROJECT_NAME:$BRANCH_NAME_TAG_SAFE-$BUILD_NUMBER
    environment:
      CI:
      RETRIES:
      REDIS_HOST: redis_test
      QUEUES_REDIS_HOST: redis_test
      HISTORY_REDIS_HOST: redis_test
      ANALYTICS_QUEUES_REDIS_HOST: redis_test
      ANALYTICS_QUEUES_BQ_SINK_REDIS_HOST: redis_test
      MONGO_HOST: mongo
      POSTGRES_HOST: postgres
      TEST_NAME_PATTERN: ${TEST_NAME_PATTERN}
      NODE_ENV: test
      NODE_OPTIONS: "--unhandled-rejections=strict"
      REQ_LOCKDOWN_MODE: throw
      REQ_VALIDATION_MODE: enforce
    volumes:
      - ./reports:/overleaf/services/real-time/reports
    depends_on:
      redis_test:
        condition: service_healthy
    user: node
    command: yarn run test:acceptance

  tar:
    build: .
    image: ci/$PROJECT_NAME:$BRANCH_NAME_TAG_SAFE-$BUILD_NUMBER
    volumes:
      - ./:/tmp/build/
    command: tar -czf /tmp/build/build.tar.gz --exclude=build.tar.gz --exclude-vcs .
    user: root

  redis_test:
    image: redis:7.4.8
    # Throw-away test data in tmpfs: the image declares a VOLUME here, which would otherwise leave an anonymous volume behind after every run.
    tmpfs:
      - /data
    healthcheck:
      test: ping="$$(redis-cli ping)" && [ "$$ping" = 'PONG' ]
      interval: 1s
      retries: 20
